# The SHIPPED seat catalog: every built-in seat and every built-in panel.
#
# This file is DATA, loaded by seats.py and merged with the user's config layers
# (per-repo .crew/config.toml, then global ~/.crew-config.toml). A user's
# [seats.<name>] table tunes a seat here, or declares a new one of its own; the
# resolution is per-seat-per-key (repo > global > this file).
#
# Seat keys:
#   via               the execution channel, as a one-element list: codex / cursor
#                     / agy run an external CLI; claude seats are native Task
#                     voices on a Claude host and use the claude CLI elsewhere.
#   provider          accepted as the legacy spelling of `via` for user config.
#   model             the model string that the channel accepts (`codex exec
#                     --model`, `agent --model`, `agy --model`); for a `claude`
#                     channel it must be a Task-tool alias (TASK_MODEL_ALIASES).
#   native_model      cursor only; the exact variant slug the app's Task path offers
#                     for the seat's family, set after a one-time badge read on the
#                     app (`docs/cursor-host.md` records the run id); unset means
#                     the seat is dropped from standalone review on a Cursor host;
#                     `model` still drives the CLI route.
#   opt_in            true keeps the seat OUT of every built-in panel: it is
#                     registered but only runs when named (--seats <name>). WHY
#                     each one is opt-in (premium cost bucket, redundancy) lives
#                     in docs/engine-notes.md.
#   reasoning_effort  codex only. Unset means the provider's own default.
#   print_timeout     agy only. Unset means the provider's own default.
#
# No shipped seat rides the agy channel: declare one ([seats.<name>] with
# via = ["agy"] and a model) to use that CLI. The bare name `agy` is then the
# channel's GROUP TOKEN, so no seat may take it.
#
# ORDER IS LOAD-BEARING: the built-in subprocess panel, the premium-off set, and
# the scaffolded config all read this table in the order written here.

[seats.astra]
via = ["codex"]
model = "gpt-6-astra"

[seats.sol]
via = ["codex"]
model = "gpt-6-sol"

[seats.luna]
via = ["codex"]
model = "gpt-6-luna"

[seats.terra]
via = ["codex"]
model = "gpt-5.6-terra"
opt_in = true

[seats.cursor-gpt]
via = ["cursor"]
model = "gpt-5.5-extra-high"
opt_in = true

[seats.cursor-gemini]
via = ["cursor"]
model = "gemini-3.7-flash-high"
opt_in = true

[seats.cursor-glm]
via = ["cursor"]
model = "glm-5.2-max"
opt_in = true

[seats.cursor-grok]
via = ["cursor"]
model = "cursor-grok-4.6-xhigh"
opt_in = true

[seats.cursor-auto]
via = ["cursor"]
model = "auto"

[seats.cursor-composer]
via = ["cursor"]
model = "composer-2.5"
native_model = "composer-2.5-fast"

# The Claude seats. Same catalog, host-resolved driver: the orchestrator spawns
# them as native Task voices on a Claude host, while the engine uses the claude
# CLI when no native Claude channel is available.
[seats.opus]
via = ["claude"]
model = "opus"

[seats.sonnet]
via = ["claude"]
model = "sonnet"

[seats.fable]
via = ["claude"]
model = "fable"
opt_in = true

# The built-in panels. `cursor` holds the literal GROUP TOKEN, not an expanded
# cursor-* list: the token is expanded at resolution time so it grows with the
# catalog. A [panels] table in a user config redefines a panel by name.
[panels]
full = ["astra", "sol", "luna", "cursor-auto", "cursor-composer", "opus", "sonnet"]
quick = ["astra", "sol", "sonnet"]
lite = ["opus", "sonnet"]
solo = ["opus"]
cursor = ["cursor"]
