# ~/.crew-config.toml — generated by /crew:init on <DATE>
# machine-wide defaults below per-repo .crew/config.toml.
# Resolution: CLI flag > per-repo .crew/config.toml > global ~/.crew-config.toml > built-in.
# Every key below is OPTIONAL; delete what you don't need. Python 3.11+ required to load.

# Default panel when you name neither --panel nor --seats.
# Cost-safe built-in full = codex + codex-luna + agy + cursor-auto + cursor-composer + opus + sonnet.
default_panel = "full"

# [debate].panel — /crew:debate's default panel (can default fuller than reviews).
# [debate]
# panel = "full"

# [dispatch].seat — /crew:dispatch's default WRITE seat (must be ONE known subprocess
# seat: codex-*/agy/cursor-*; a panel name or the 'cursor' group token is rejected).
[dispatch]
seat = "codex"

# [panels] — redefine a built-in preset or add a custom one (usable via --panel <name>).
# [panels]
# nightly = ["codex", "opus"]

# ---- Per-seat tuning + availability -------------------------------------------------
# available = false drops a seat from EVERY resolved panel. It is an opt-OUT: runtime
# already skips a CLI that isn't installed, so these flags are mainly for DISCOVERABILITY,
# a DELIBERATE opt-out, and capturing your confirmed preferences — NOT a requirement.

[seats.codex]
# model = "gpt-5.6-sol"
# reasoning_effort = "xhigh"     # codex-seat knob (read per seat: [seats.codex] here)

[seats.codex-luna]
# model = "gpt-5.6-luna"
# reasoning_effort = "xhigh"     # codex-seat knob (read per seat: [seats.codex-luna] here)

[seats.agy]
# model = "Gemini 3.1 Pro (High)"
# print_timeout = "8m"           # agy-only knob (read only from [seats.agy])

[seats.cursor-auto]
# model = "auto"

[seats.cursor-composer]
# model = "composer-2.5"

# [seats.codex-terra]   # opt-in; see docs/engine-notes.md for why

# [seats.cursor-gpt]   # opt-in; see docs/engine-notes.md for why

# [seats.cursor-gemini]   # opt-in; see docs/engine-notes.md for why

# [seats.cursor-glm]   # opt-in; see docs/engine-notes.md for why

# [seats.cursor-grok]   # opt-in; see docs/engine-notes.md for why

# [tuning].timeout — per-seat wall-clock default (positive integer seconds).
# [tuning].deadline_minutes: the persistence loops' wall clock, read by
#   `crew state init` (1-240; an out-of-range value is
#   dropped with a warning, never silently clamped).
# [tuning]
# timeout = 600
# deadline_minutes = 120

# ---- Claude (subscription) seats — opt-out only -----------------------------------

[seats.opus]
available = false
