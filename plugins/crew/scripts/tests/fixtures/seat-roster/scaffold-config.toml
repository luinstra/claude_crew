# ~/.crew-config.toml — generated by /crew:init on <DATE>
# machine-wide defaults below per-repo .crew/config.toml.
# Resolution: CLI flag > per-repo .crew/config.toml > global ~/.crew-config.toml > built-in.
# Every key below is OPTIONAL; delete what you don't need. Python 3.11+ required to load.

# Default panel when you name neither --panel nor --seats.
# Cost-safe built-in full = codex + codex-luna + agy + cursor-auto + cursor-composer + opus + sonnet.
default_panel = "full"

# [debate].panel — /crew:debate's default panel (can default fuller than reviews).
# [debate]
# panel = "full"

# [dispatch].seat — /crew:dispatch's default WRITE seat (must be ONE known subprocess
# seat: codex-*/agy/cursor-*; a panel name or the 'cursor' group token is rejected).
[dispatch]
seat = "codex"

# [dispatch.codex]: write-mode tuning for /crew:dispatch (opt-in; unknown keys warn and drop)
# [dispatch.codex]
# profile = "<name>"   # codex exec --profile <name>: layers $CODEX_HOME/<name>.config.toml over the base user config

# [dispatch.cursor]: write-mode tuning for /crew:dispatch (opt-in; unknown keys warn and drop)
# [dispatch.cursor]
# force = true   # pass --force: allow commands unless explicitly denied (headless-write approval)
# approve_mcps = true   # pass --approve-mcps: auto-approve every configured MCP server

# [panels] — redefine a built-in preset or add a custom one (usable via --panel <name>).
# [panels]
# nightly = ["codex", "opus"]

# [build].executor: /crew:build's implement-step executor. Default is the
#   crew:executor Task agent (Claude); set it to ONE write-capable subprocess
#   seat (e.g. codex-luna) to route each round through that model instead. The
#   --executor <seat> flag overrides this per invocation.
# executor_retries: how many times to retry a FAILED external-executor round
#   (int 0..2, default 0). Retries STACK on the failed attempt's partial edits
#   (no clean-tree revert), so the cap is low.
# resume_executor: resume the external executor's provider conversation across
#   build rounds (bool, DEFAULT true). Set false to start each round fresh.
#   Only affects an external --executor / [build].executor seat.
#   Exact continuation applies ONLY to SUPPORTING providers (codex, cursor);
#   agy and other unsupported binaries always start fresh regardless of this toggle.
# [build]
# executor = "crew:executor"
# executor_retries = 0
# resume_executor = true

# ---- Per-seat tuning + availability -------------------------------------------------
# available = false drops a seat from EVERY resolved panel. It is an opt-OUT: runtime
# already skips a CLI that isn't installed, so these flags are mainly for DISCOVERABILITY,
# a DELIBERATE opt-out, and capturing your confirmed preferences — NOT a requirement.

[seats.codex]
# model = "gpt-5.6-sol"
# reasoning_effort = "xhigh"     # codex-seat knob (read per seat: [seats.codex] here)

[seats.codex-luna]
# model = "gpt-5.6-luna"
# reasoning_effort = "xhigh"     # codex-seat knob (read per seat: [seats.codex-luna] here)

[seats.agy]
# model = "Gemini 3.1 Pro (High)"
# print_timeout = "8m"           # agy-only knob (read only from [seats.agy])

[seats.cursor-auto]
# model = "auto"

[seats.cursor-composer]
# model = "composer-2.5"

# [seats.codex-terra]   # opt-in; see docs/engine-notes.md for why

# [seats.cursor-gpt]   # opt-in; see docs/engine-notes.md for why

# [seats.cursor-gemini]   # opt-in; see docs/engine-notes.md for why

# [seats.cursor-glm]   # opt-in; see docs/engine-notes.md for why

# [seats.cursor-grok]   # opt-in; see docs/engine-notes.md for why

# [tuning].timeout — per-seat wall-clock default (positive integer seconds).
# [tuning].deadline_minutes: the persistence loops' wall clock, read by
#   `crew state init` (1-1440; 0 = no deadline, honored from the
#   global ~/.crew-config.toml only, and the stop-fires cap still bounds
#   the loop. An out-of-range value is dropped with a warning, never
#   silently clamped).
# [tuning]
# timeout = 600
# deadline_minutes = 240
